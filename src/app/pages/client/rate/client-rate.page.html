<ion-content [fullscreen]="true" class="ride-page">
  <div class="screen">
    <button class="skip" (click)="skip()">Omitir</button>

    <span class="done">✓ Viaje finalizado @if (fare) { · {{ cop(fare) }} }</span>

    <div class="avatar">
      <span>{{ driverName ? initials(driverName) : '★' }}</span>
    </div>

    <h1>{{ title }}</h1>
    @if (details) {
      <p class="details ride-mono">{{ details }}</p>
    }

    <div class="stars">
      @for (n of stars; track n) {
        <button type="button" class="star" [class.on]="n <= score" (click)="score = n" [attr.aria-label]="n + ' estrellas'">
          <svg viewBox="0 0 24 24" width="34" height="34">
            <path
              d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"
              [attr.fill]="n <= score ? 'currentColor' : 'none'"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      }
    </div>

    <div class="tags">
      @for (t of tags; track t) {
        <button type="button" class="tag" [class.on]="selectedTags.has(t)" (click)="toggleTag(t)">{{ t }}</button>
      }
    </div>

    <textarea class="comment" rows="3" [(ngModel)]="comment" name="comment" placeholder="Escribe un comentario (opcional)…"></textarea>

    <div class="incident">
      <span>Reportar una incidencia</span>
      <ion-toggle [(ngModel)]="hasIncident" name="hasIncident" aria-label="Reportar una incidencia"></ion-toggle>
    </div>

    @if (error) {
      <p class="ride-error">{{ error }}</p>
    }
    @if (success) {
      <p class="ride-success">{{ success }}</p>
    }

    <div class="spacer"></div>

    <button class="ride-btn" (click)="submit()" [disabled]="sending || !!success">
      @if (sending) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Enviar calificación
      }
    </button>
  </div>
</ion-content>
