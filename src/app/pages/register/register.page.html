<ion-content [fullscreen]="true" class="ride-page">
  <div class="screen">
    <div class="circle-big"></div>

    <header>
      <button class="back" (click)="router.navigateByUrl('/login')" aria-label="Volver">←</button>
      <span class="brand">RideApp</span>
    </header>

    <h1 class="headline">
      @if (role === 'driver') {
        Conduce y<br /><span>gana.</span>
      } @else {
        Crea tu<br /><span>cuenta.</span>
      }
    </h1>

    <div class="roles">
      <button type="button" [class.on]="role === 'client'" (click)="role = 'client'">Pasajero</button>
      <button type="button" [class.on]="role === 'driver'" (click)="role = 'driver'">Conductor</button>
    </div>

    <form (ngSubmit)="submit()">
      <label class="field">
        <span class="field-label">Nombre completo</span>
        <input name="name" [(ngModel)]="name" placeholder="Daniela Morales" autocomplete="name" />
      </label>
      <label class="field">
        <span class="field-label">Correo</span>
        <input type="email" name="email" [(ngModel)]="email" placeholder="daniela@ejemplo.com" autocomplete="email" />
      </label>
      <label class="field">
        <span class="field-label">Teléfono</span>
        <input type="tel" name="phone" [(ngModel)]="phone" placeholder="3109876543" autocomplete="tel" />
      </label>
      <label class="field">
        <span class="field-label">Contraseña · mínimo 8 caracteres</span>
        <input type="password" name="password" [(ngModel)]="password" placeholder="••••••••" autocomplete="new-password" />
      </label>

      @if (role === 'driver') {
        <p class="section">Licencia y vehículo</p>
        <label class="field">
          <span class="field-label">Número de licencia</span>
          <input name="licenseNumber" [(ngModel)]="licenseNumber" placeholder="LC-88291-CO" />
        </label>
        <div class="grid">
          <label class="field">
            <span class="field-label">Placa</span>
            <input name="plate" [(ngModel)]="plate" placeholder="HJK-987" class="upper" />
          </label>
          <label class="field">
            <span class="field-label">Color</span>
            <input name="color" [(ngModel)]="color" placeholder="Rojo" />
          </label>
          <label class="field">
            <span class="field-label">Marca</span>
            <input name="brand" [(ngModel)]="brand" placeholder="Mazda" />
          </label>
          <label class="field">
            <span class="field-label">Modelo</span>
            <input name="model" [(ngModel)]="model" placeholder="Mazda 3" />
          </label>
          <label class="field">
            <span class="field-label">Año</span>
            <input type="number" name="year" [(ngModel)]="year" placeholder="2024" />
          </label>
          <label class="field">
            <span class="field-label">Capacidad</span>
            <input type="number" name="capacity" [(ngModel)]="capacity" placeholder="4" />
          </label>
        </div>
        <p class="note">Después del registro tu cuenta quedará <b>pendiente</b> hasta que un administrador la apruebe.</p>
      }

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="loading">
        @if (loading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          {{ role === 'driver' ? 'Registrarme como conductor' : 'Crear cuenta' }}
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        }
      </button>

      <p class="footer">
        ¿Ya tienes cuenta?
        <button type="button" class="link-green" (click)="router.navigateByUrl('/login')">Inicia sesión</button>
      </p>
    </form>
  </div>
</ion-content>
