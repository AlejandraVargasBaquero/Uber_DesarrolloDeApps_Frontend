<ion-header>
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Recuperar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="box">
    <p>Ingresa el correo de tu cuenta y la nueva contraseña.</p>

    <form (ngSubmit)="submit()">
      <ion-list lines="full">
        <ion-item>
          <ion-input label="Correo" labelPlacement="floating" type="email" name="email" [(ngModel)]="email"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Nueva contraseña" labelPlacement="floating" type="password" name="newPassword" [(ngModel)]="newPassword"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Confirmar contraseña" labelPlacement="floating" type="password" name="confirmPassword" [(ngModel)]="confirmPassword"></ion-input>
        </ion-item>
      </ion-list>

      @if (error) {
        <ion-text color="danger"><p>{{ error }}</p></ion-text>
      }
      @if (success) {
        <ion-text color="success"><p>{{ success }}</p></ion-text>
      }

      <ion-button type="submit" expand="block" color="dark" [disabled]="loading">
        @if (loading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Restablecer
        }
      </ion-button>

      @if (success) {
        <ion-button expand="block" fill="outline" color="dark" (click)="router.navigateByUrl('/login')">
          Ir a iniciar sesión
        </ion-button>
      }
    </form>
  </div>
</ion-content>
