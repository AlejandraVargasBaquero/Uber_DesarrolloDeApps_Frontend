<ion-content [fullscreen]="true" class="ride-page">
  <div class="screen">
    <div class="circle-big"></div>

    <header>
      <button class="back" (click)="router.navigateByUrl('/login')" aria-label="Volver">←</button>
      <span class="brand">RideApp</span>
    </header>

    <h1 class="headline">Nueva<br /><span>contraseña.</span></h1>
    <p class="lead">Escribe el correo de tu cuenta y la contraseña que quieres usar.</p>

    <form (ngSubmit)="submit()">
      <label class="field">
        <span class="field-label">Correo</span>
        <input type="email" name="email" [(ngModel)]="email" placeholder="cliente@uber.com" autocomplete="email" />
      </label>
      <label class="field">
        <span class="field-label">Nueva contraseña</span>
        <input type="password" name="newPassword" [(ngModel)]="newPassword" placeholder="••••••••" autocomplete="new-password" />
      </label>
      <label class="field">
        <span class="field-label">Confirmar contraseña</span>
        <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="••••••••" autocomplete="new-password" />
      </label>

      @if (error) {
        <p class="error">{{ error }}</p>
      }
      @if (success) {
        <p class="success">{{ success }}</p>
      }

      <div class="spacer"></div>

      @if (success) {
        <button type="button" class="btn-primary" (click)="router.navigateByUrl('/login')">Ir a iniciar sesión →</button>
      } @else {
        <button type="submit" class="btn-primary" [disabled]="loading">
          @if (loading) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Restablecer contraseña
          }
        </button>
      }
    </form>
  </div>
</ion-content>
