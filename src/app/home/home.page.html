<ion-header>
  <ion-toolbar color="dark">
    <ion-title>Inicio</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">Salir</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Hola, {{ user?.name }}</h2>
  <p>Correo: {{ user?.email }}</p>
  <p>Rol: {{ user?.role }}</p>
</ion-content>
